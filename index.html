<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite Especial ❤️</title>
    <style>
        /* CSS INTEGRADO */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Impede que apareçam barras de scroll quando o botão foge */
        }

        .card {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border: 4px solid #ffb6c1;
            z-index: 1;
        }

        h1 { color: #d63384; }

        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        #yesBtn {
            background-color: #ff6b6b;
            color: white;
            font-weight: bold;
        }

        /* O SEGREDO ESTÁ AQUI: Position FIXED ou ABSOLUTE */
        #noBtn {
            background-color: #ced4da;
            color: #495057;
            position: fixed; /* Isso permite que ele se mova por todo o ecrã */
            z-index: 999;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Você esta brava comigo ? 🌸</h1>
        <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdjYzcjk5M2VxdTJscDlyam52YzNpbWc1bjg0aDRlc29oMWRld2FnaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/SYeAP17mD2FOIR2CzR/giphy.gif" width="200">
        
        <div class="btn-container">
            <button id="yesBtn">SIM</button>
            <button id="noBtn">NÃO</button>
        </div>
    </div>

    <script>
        // JAVASCRIPT INTEGRADO
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        function moveNoButton() {
        const padding = 20;
        const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
        const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;
        const randomX = Math.floor(Math.random() * maxWidth);
        const randomY = Math.floor(Math.random() * maxHeight);
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
}

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('click', moveNoButton);

        // AQUI ESTÁ A MUDANÇA:
        yesBtn.addEventListener('click', () => {
            // Em vez de alert(), vamos criar um elemento na hora
            const mensagem = document.createElement('div');
            mensagem.innerHTML = `
        <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                    background: white; padding: 20px; border-radius: 15px; border: 3px solid #ffb6c1;
                    box-shadow: 0 0 20px rgba(0,0,0,0.2); z-index: 10000; text-align: center;">
            <h2 style="color: #d63384; margin-top: 0;">Kelvin diz:</h2>
            <p style="font-size: 1.2rem;">Eu sabia ❤️😍</p>
            <button onclick="location.reload()" style="background: #ff6b6b; color: white; border: none; 
                    padding: 10px 20px; border-radius: 5px; cursor: pointer;">Fechar</button>
        </div>
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
                    background: rgba(0,0,0,0.3); z-index: 9999;"></div>
    `;
    document.body.appendChild(mensagem);
});
        // Se quiseres que mude a imagem ou texto ao clicar no SIM, avisa-me!
;
    </script>

</body>
</html>
